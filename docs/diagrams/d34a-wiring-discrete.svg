<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Hand-authored figure D34a. Opaque white background so it stays visible on
       GitHub's dark theme (see docs/diagrams/README.md). The IR driver reproduces
       the circuit of flummer/tt-ir-pmod rev 1.3, with 47 ohm LED resistors
       instead of 15 ohm, to keep the Pico-ICE 3V3 load under 100 mA. -->
  <rect x="0" y="0" width="1100" height="900" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f172a"/>
    </marker>
    <g id="gnd" stroke="#0f172a" stroke-width="2">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-7" y1="5" x2="7" y2="5"/>
      <line x1="-3" y1="10" x2="3" y2="10"/>
    </g>
    <g id="vcc">
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#0f172a" stroke-width="2"/>
      <text x="0" y="-7" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">3V3</text>
    </g>
    <g id="nc" stroke="#64748b" stroke-width="2">
      <line x1="-5" y1="-5" x2="5" y2="5"/>
      <line x1="-5" y1="5" x2="5" y2="-5"/>
    </g>
    <!-- NPN, origin at the circle centre: base enters from x=-40, collector leaves
         upward at (8,-40), emitter downward at (8,40). -->
    <g id="npn" stroke="#0f172a" stroke-width="2" fill="none">
      <circle cx="0" cy="0" r="22" fill="#ffffff"/>
      <line x1="-40" y1="0" x2="-10" y2="0"/>
      <line x1="-10" y1="-12" x2="-10" y2="12"/>
      <line x1="-10" y1="-6" x2="8" y2="-20"/>
      <line x1="8" y1="-20" x2="8" y2="-40"/>
      <line x1="-10" y1="6" x2="6" y2="18" marker-end="url(#arrow)"/>
      <line x1="8" y1="20" x2="8" y2="40"/>
    </g>
    <!-- IR LED pointing down, anode at y=0, cathode at y=20 -->
    <g id="irled" stroke="#0f172a" stroke-width="2">
      <path d="M-12,0 L12,0 L0,20 Z" fill="#a78bfa"/>
      <line x1="-12" y1="20" x2="12" y2="20"/>
    </g>
  </defs>

  <g stroke="#0f172a" stroke-width="2" fill="none">

    <!-- ===================== Pico-ICE ===================== -->
    <rect x="30" y="30" width="230" height="840" rx="6" fill="#f1f5f9" stroke="#334155"/>

    <!-- ===================== start button, pin 10 ===================== -->
    <line x1="260" y1="150" x2="400" y2="150"/>
    <line x1="400" y1="150" x2="400" y2="128"/>
    <rect x="394" y="92" width="12" height="36" fill="#ffffff"/>
    <line x1="400" y1="92" x2="400" y2="78"/>
    <line x1="400" y1="150" x2="472" y2="150"/>
    <circle cx="476" cy="150" r="4" fill="#ffffff"/>
    <circle cx="524" cy="150" r="4" fill="#ffffff"/>
    <line x1="468" y1="137" x2="532" y2="137"/>
    <line x1="500" y1="137" x2="500" y2="124"/>
    <line x1="490" y1="124" x2="510" y2="124"/>
    <line x1="528" y1="150" x2="580" y2="150"/>
    <line x1="580" y1="150" x2="580" y2="165"/>

    <!-- ===================== loop jumper, pin 11 ===================== -->
    <line x1="260" y1="270" x2="400" y2="270"/>
    <line x1="400" y1="270" x2="400" y2="248"/>
    <rect x="394" y="212" width="12" height="36" fill="#ffffff"/>
    <line x1="400" y1="212" x2="400" y2="198"/>
    <line x1="400" y1="270" x2="477" y2="270"/>
    <rect x="477" y="265" width="10" height="10" fill="#ffffff"/>
    <rect x="513" y="265" width="10" height="10" fill="#ffffff"/>
    <rect x="469" y="257" width="62" height="26" rx="3" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="523" y1="270" x2="580" y2="270"/>
    <line x1="580" y1="270" x2="580" y2="285"/>

    <!-- ===================== busy LED, pin 4 ===================== -->
    <line x1="260" y1="380" x2="310" y2="380"/>
    <rect x="310" y="374" width="40" height="12" fill="#ffffff"/>
    <line x1="350" y1="380" x2="400" y2="380"/>
    <path d="M400,368 L424,380 L400,392 Z" fill="#22c55e"/>
    <line x1="424" y1="368" x2="424" y2="392"/>
    <line x1="424" y1="380" x2="580" y2="380"/>
    <line x1="580" y1="380" x2="580" y2="395"/>

    <!-- ===================== fail LED, pin 48 ===================== -->
    <line x1="260" y1="460" x2="310" y2="460"/>
    <rect x="310" y="454" width="40" height="12" fill="#ffffff"/>
    <line x1="350" y1="460" x2="400" y2="460"/>
    <path d="M400,448 L424,460 L400,472 Z" fill="#ef4444"/>
    <line x1="424" y1="448" x2="424" y2="472"/>
    <line x1="424" y1="460" x2="580" y2="460"/>
    <line x1="580" y1="460" x2="580" y2="475"/>

    <!-- ===================== IR driver ===================== -->
    <rect x="290" y="566" width="800" height="314" rx="6" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- pin 3 unused -->
    <line x1="260" y1="540" x2="284" y2="540"/>

    <!-- input: pin 6 -> R5 -> C1 -> node with R6 pull-up -> Q1 base -->
    <line x1="260" y1="700" x2="320" y2="700"/>
    <rect x="320" y="694" width="40" height="12" fill="#ffffff"/>
    <line x1="360" y1="700" x2="404" y2="700"/>
    <line x1="404" y1="688" x2="404" y2="712"/>
    <line x1="412" y1="688" x2="412" y2="712"/>
    <line x1="412" y1="700" x2="470" y2="700"/>
    <line x1="470" y1="700" x2="470" y2="666"/>
    <rect x="464" y="630" width="12" height="36" fill="#ffffff"/>
    <line x1="470" y1="630" x2="470" y2="615"/>
    <line x1="470" y1="700" x2="520" y2="700"/>

    <!-- Q1 BC807, PNP: emitter up to 3V3, collector down to R7 and the base bus -->
    <circle cx="530" cy="700" r="22" fill="#ffffff"/>
    <line x1="520" y1="688" x2="520" y2="712"/>
    <line x1="538" y1="656" x2="538" y2="680"/>
    <line x1="538" y1="680" x2="522" y2="692" marker-end="url(#arrow)"/>
    <line x1="520" y1="707" x2="538" y2="720"/>
    <line x1="538" y1="720" x2="538" y2="812"/>
    <rect x="532" y="812" width="12" height="36" fill="#ffffff"/>
    <line x1="538" y1="848" x2="538" y2="856"/>

    <!-- base bus to the three NPN stages -->
    <line x1="538" y1="800" x2="940" y2="800"/>
    <line x1="640" y1="800" x2="640" y2="730"/>
    <line x1="790" y1="800" x2="790" y2="730"/>
    <line x1="940" y1="800" x2="940" y2="730"/>

    <!-- three LED stages: 3V3 -> IR LED -> 15R -> collector -->
    <line x1="688" y1="592" x2="688" y2="606"/>
    <line x1="688" y1="626" x2="688" y2="646"/>
    <rect x="682" y="646" width="12" height="36" fill="#ffffff"/>
    <line x1="688" y1="682" x2="688" y2="690"/>

    <line x1="838" y1="592" x2="838" y2="606"/>
    <line x1="838" y1="626" x2="838" y2="646"/>
    <rect x="832" y="646" width="12" height="36" fill="#ffffff"/>
    <line x1="838" y1="682" x2="838" y2="690"/>

    <line x1="988" y1="592" x2="988" y2="606"/>
    <line x1="988" y1="626" x2="988" y2="646"/>
    <rect x="982" y="646" width="12" height="36" fill="#ffffff"/>
    <line x1="988" y1="682" x2="988" y2="690"/>

    <!-- supply decoupling -->
    <line x1="310" y1="770" x2="310" y2="790"/>
    <line x1="298" y1="790" x2="322" y2="790"/>
    <line x1="298" y1="798" x2="322" y2="798"/>
    <line x1="310" y1="798" x2="310" y2="815"/>
    <line x1="410" y1="770" x2="410" y2="790"/>
    <line x1="398" y1="790" x2="422" y2="790"/>
    <line x1="398" y1="798" x2="422" y2="798"/>
    <line x1="410" y1="798" x2="410" y2="815"/>
  </g>

  <use href="#npn" x="680" y="730"/>
  <use href="#npn" x="830" y="730"/>
  <use href="#npn" x="980" y="730"/>
  <use href="#irled" x="688" y="606"/>
  <use href="#irled" x="838" y="606"/>
  <use href="#irled" x="988" y="606"/>

  <!-- LED light arrows -->
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="410" y1="364" x2="420" y2="350"/>
    <line x1="419" y1="366" x2="429" y2="352"/>
    <line x1="410" y1="444" x2="420" y2="430"/>
    <line x1="419" y1="446" x2="429" y2="432"/>
    <line x1="700" y1="614" x2="714" y2="604"/>
    <line x1="700" y1="622" x2="714" y2="612"/>
    <line x1="850" y1="614" x2="864" y2="604"/>
    <line x1="850" y1="622" x2="864" y2="612"/>
    <line x1="1000" y1="614" x2="1014" y2="604"/>
    <line x1="1000" y1="622" x2="1014" y2="612"/>
  </g>

  <!-- power symbols, node dots, no-connect marks -->
  <use href="#vcc" x="400" y="78"/>
  <use href="#vcc" x="400" y="198"/>
  <use href="#gnd" x="580" y="165"/>
  <use href="#gnd" x="580" y="285"/>
  <use href="#gnd" x="580" y="395"/>
  <use href="#gnd" x="580" y="475"/>
  <use href="#vcc" x="470" y="615"/>
  <use href="#vcc" x="538" y="656"/>
  <use href="#vcc" x="688" y="592"/>
  <use href="#vcc" x="838" y="592"/>
  <use href="#vcc" x="988" y="592"/>
  <use href="#gnd" x="538" y="856"/>
  <use href="#gnd" x="688" y="770"/>
  <use href="#gnd" x="838" y="770"/>
  <use href="#gnd" x="988" y="770"/>
  <use href="#vcc" x="310" y="770"/>
  <use href="#vcc" x="410" y="770"/>
  <use href="#gnd" x="310" y="815"/>
  <use href="#gnd" x="410" y="815"/>
  <circle cx="400" cy="150" r="4" fill="#0f172a"/>
  <circle cx="400" cy="270" r="4" fill="#0f172a"/>
  <circle cx="470" cy="700" r="4" fill="#0f172a"/>
  <circle cx="538" cy="800" r="4" fill="#0f172a"/>
  <circle cx="640" cy="800" r="4" fill="#0f172a"/>
  <circle cx="790" cy="800" r="4" fill="#0f172a"/>
  <use href="#nc" x="284" y="540"/>

  <!-- ===================== text ===================== -->
  <g fill="#0f172a">
    <text x="145" y="60" text-anchor="middle" font-size="16" font-weight="bold">Pico-ICE</text>
    <text x="145" y="78" text-anchor="middle" font-size="12" fill="#475569">iCE40UP5K · pins as in pico-ice.pcf</text>

    <g text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="13">
      <text x="250" y="144">button_in</text>
      <text x="250" y="264">loop_forever_in</text>
      <text x="250" y="374">active_led_out</text>
      <text x="250" y="454">fail_led_out</text>
      <text x="250" y="534">ir_led_out</text>
      <text x="250" y="694">ir_ledn_out</text>
    </g>
    <g text-anchor="end" font-size="12" fill="#475569">
      <text x="250" y="166">pin 10 · active low</text>
      <text x="250" y="286">pin 11 · active high</text>
      <text x="250" y="396">pin 4 · active high</text>
      <text x="250" y="476">pin 48 · active high</text>
      <text x="250" y="556">pin 3 · unused here</text>
      <text x="250" y="716">pin 6 · low = IR on</text>
    </g>

    <text x="414" y="114">R1 10k</text>
    <text x="414" y="234">R2 10k</text>
    <text x="500" y="176" text-anchor="middle">S1 start</text>
    <text x="500" y="302" text-anchor="middle">loop jumper</text>
    <text x="330" y="366" text-anchor="middle">R3 1k</text>
    <text x="330" y="446" text-anchor="middle">R4 1k</text>
    <text x="412" y="414" text-anchor="middle">D1 green · busy</text>
    <text x="412" y="494" text-anchor="middle">D2 red · fail</text>

    <g font-size="12" fill="#334155">
      <text x="620" y="146">pressed: pin low, a run starts</text>
      <text x="620" y="162" fill="#64748b">in parallel with the board's own SW2</text>
      <text x="620" y="266">jumper fitted: one pass, then stop</text>
      <text x="620" y="282">jumper open: loop forever</text>
      <text x="620" y="384">lit while a run is in progress</text>
      <text x="620" y="464">lit if the code table is rejected</text>
    </g>

    <text x="300" y="588" font-weight="bold" fill="#5b21b6">IR driver</text>
    <text x="370" y="588" font-size="12" fill="#475569">the circuit of tt-ir-pmod rev 1.3</text>

    <text x="340" y="686" text-anchor="middle">R5 1k</text>
    <text x="408" y="680" text-anchor="middle">C1 100n</text>
    <text x="458" y="652" text-anchor="end">R6 10k</text>
    <text x="558" y="704">Q1 BC807</text>
    <text x="552" y="834">R7 10k</text>
    <text x="326" y="786" font-size="12">+</text>
    <text x="328" y="808">C2 100µ</text>
    <text x="428" y="808">C3 100n</text>

    <text x="720" y="622">D3 IR</text>
    <text x="700" y="668">R8 47Ω</text>
    <text x="708" y="734">Q2 BC817</text>
    <text x="870" y="622">D4 IR</text>
    <text x="850" y="668">R9 47Ω</text>
    <text x="858" y="734">Q3 BC817</text>
    <text x="1020" y="622">D5 IR</text>
    <text x="1000" y="668">R10 47Ω</text>
    <text x="1008" y="734">Q4 BC817</text>

    <g font-size="12" fill="#475569">
      <text x="610" y="826">IR LEDs, 940 nm: IR333C (D3, D5), IR333-A (D4)</text>
      <text x="610" y="842">input AC-coupled: passes the carrier, not a steady level</text>
      <text x="610" y="858">R8–R10 are 47 Ω, three times the PMOD's 15 Ω: Pico-ICE 3V3 load under 100 mA</text>
    </g>
  </g>
</svg>
